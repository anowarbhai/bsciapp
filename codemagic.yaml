workflows:
  android-production:
    name: BSCI Android Production APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - bsci_upload_key
    scripts:
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Flutter tests
        script: flutter test
      - name: Build signed production APK
        script: flutter build apk --release
      - name: Create APK checksum
        script: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha256

  ios-simulator:
    name: BSCI iOS Simulator Validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Enable Flutter Swift Package Manager support
        script: flutter config --enable-swift-package-manager
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Flutter tests
        script: flutter test
      - name: Build unsigned iOS Simulator app
        script: flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/Runner.app
