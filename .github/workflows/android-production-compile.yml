name: Android Production Compile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-production-compile.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CM_PRODUCTION_UNSIGNED: "true"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compile production APK
        run: flutter build apk --release

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: bsci-android-production-unsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
