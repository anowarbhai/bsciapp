org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Windows projects and the Pub cache live on different roots here. Disable Kotlin's
# incremental cache so it does not try to serialize relative paths across drives.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
